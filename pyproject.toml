[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regress"
version = "0.1.0"
description = "Model Regression Detection System: CI/CD for LLM prompts."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "deepeval>=4.2",  # GEval summary relevance (judge = our DeepSeek provider)
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
data = ["pandas>=2.0", "numpy>=1.26"]  # dataset preparation scripts only
dashboard = ["streamlit>=1.40", "pandas>=2.0", "altair>=5"]

[tool.setuptools.packages.find]
include = ["regress*"]

[tool.setuptools.package-data]
"regress.reporting" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
