# =============================================================================
# GOLDEN DATASET - HAND-WRITTEN DRAFT
# =============================================================================
# This file is the human source of truth. Compile it with:
#     python scripts/build_dataset.py
# which validates every case, assigns IDs, checks for duplicates and leftover
# personal data, and writes data/golden.json (what the eval engine reads).
#
# RULES
#   - Write cases under `cases:` at the bottom. Do NOT add an `id` field.
#   - Inputs are adapted from public complaint sources (data/candidates.csv) and
#     ANONYMIZED: replace names, emails, phones, order/card/account numbers, and
#     handles. Placeholders like [ORDER_ID], [PHONE], [EMAIL] are fine.
#   - Labels are your judgement. When torn between two categories, pick one,
#     mark difficulty "hard", and record your reasoning in `notes`.
#   - Editing an input_email changes its ID (it's a new test input). Editing a
#     label, summary, difficulty, or notes keeps the ID.
#
# FIELDS
#   input_email          the customer message. Use `|` and paste as-is: typos,
#                        line breaks, emoji, odd punctuation are all welcome.
#   expected_category    billing | technical | account | general
#   ideal_summary        ONE sentence, ideally <= 25 words, starting with
#                        "Customer ...", core problem + what they want. No PII.
#                        (Matches what the prompt asks for, so the relevance
#                        score measures content, not style mismatch.)
#   expected_difficulty  easy | medium | hard  (how hard for a careful human?)
#   notes                optional: why this label, which edge case it covers.
#
# CATEGORY GUIDE (keep consistent with prompts/v1.yaml)
#   billing    charges, refunds, invoices, pricing, plan changes, failed payments
#   technical  product/app not working: bugs, errors, crashes, outages, slowness
#   account    login, password, 2FA, locked/hacked account, profile, deletion
#   general    questions, feedback, feature requests, delivery status, other
#
# EDGE-CASE CHECKLIST - aim for several of each across the 60-80 cases
#   [ ] ambiguous two-category emails (e.g. "app crashed during payment")
#   [ ] multiple issues in one email (label = the one needing action most)
#   [ ] very short emails ("refund??", "still broken")
#   [ ] heavy typos / no punctuation / txt-speak
#   [ ] Hinglish / mixed language (summary still in English)
#   [ ] sarcasm ("great, charged twice, love it") - label the real issue
#   [ ] angry customers / ALL CAPS / profanity
#   [ ] rambling or irrelevant content around a small real request
#   [ ] polite but vague ("something is off with my account?")
#   [ ] all four categories x all three difficulties represented
#
# YAML GOTCHAS
#   - Indent with spaces, never tabs. Keep the email text indented under `|`.
#   - A summary containing `: ` or starting with a quote/bracket needs quotes:
#       ideal_summary: "Customer asks: is the refund processed?"
#   - The build script reports errors as "case #N, line L".
# =============================================================================

# FORMAT EXAMPLES - ignored by the build script. Copy the shape, not the content.
examples:
  - input_email: |
      hi, i got charged 2x for my plan this month?? one on the 3rd and again on
      the 5th. pls refund one of them asap
    expected_category: billing
    ideal_summary: Customer was charged twice for their plan this month and wants one charge refunded.
    expected_difficulty: easy
    notes: Single clear billing issue; casual style and typos only.

  - input_email: |
      Your app logged me out and now says my password is wrong even though I
      haven't changed it. Also the dark mode toggle stopped working last week
      but that's minor. I need to get in today!!
    expected_category: account
    ideal_summary: Customer is locked out because their unchanged password is rejected and needs access today; dark mode toggle is also broken.
    expected_difficulty: medium
    notes: >
      Multi-issue: account access (urgent) + minor technical bug. Labeled
      account because that's what the customer needs resolved.

